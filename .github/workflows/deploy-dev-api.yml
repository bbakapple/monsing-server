name: deploy dev api

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle chmod
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --stacktrace

      - name: Build and push Docker image
        uses: docker/build-push-action@2
        with:
          context: .
          file: ./Dockerfile
          tags: judebellingham/monsing-dev:latest
          push: true
          platforms: linux/arm64
          build-args: |
            MODULE=api

      - name: Join EC2 dev server
        uses: appleboy/ssh-action@master
        env:
          JASYPT: ${{ secrets.JASYPT_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: JASYPT

          script: |
            sudo docker stop monsing-dev || true
            sudo docker rm monsing-dev || true
            
            sudo docker pull judebellingham/monsing-dev:latest
            
            sudo docker run -d --name monsing-dev \
            -p 80:8080 \
            -e "PROFILE=dev" \
            -e "JASYPT=${{secrets.JASYPT_KEY}}" \
            judebellingham/monsing-dev:latest
