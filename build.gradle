plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25'
    id 'io.gitlab.arturbosch.detekt' version '1.23.7'
}

group = 'org.bbakaple'
version = '0.0.1-SNAPSHOT'

allprojects {
    repositories {
        mavenCentral()
    }
}

tasks.register("reportMerge", io.gitlab.arturbosch.detekt.report.ReportMergeTask) {
    output = project.layout.buildDirectory.file("reports/detekt/detekt.xml")
}

tasks.register("convertCheckstyleToMarkdown") {
    doLast {
        def checkstyleFile = file("build/reports/detekt/detekt.xml")
        def outputFile = file("build/reports/detekt/detekt.md")

        if (!checkstyleFile.exists()) {
            println "Checkstyle report not found: ${checkstyleFile}"
            return
        }

        def xml = new XmlParser().parse(checkstyleFile)
        def mdContent = new StringBuilder()
        mdContent.append("# Checkstyle Report\n\n")

        xml.file.each { fileNode ->
            def fileName = fileNode.@name
            def className = fileName.substring(fileName.lastIndexOf("/") + 1)
            mdContent.append("### File: ${className}\n\n")

            fileNode.error.each { errorNode ->
                def line = errorNode.@line
                def column = errorNode.@column
                def message = errorNode.@message
                def severity = errorNode.@severity
                def source = errorNode.@source

                mdContent.append("- **Line ${line}, Column ${column}**\n")
                mdContent.append("  - Message: ${message}\n")
                mdContent.append("  - Severity: ${severity}\n")
                mdContent.append("  - Source: ${source}\n\n")
            }
        }

        outputFile.text = mdContent.toString()
        println "Checkstyle report converted to Markdown: ${outputFile}"
    }
}

tasks.withType(io.gitlab.arturbosch.detekt.report.ReportMergeTask).configureEach {
    finalizedBy("convertCheckstyleToMarkdown")
}

subprojects {

    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.kotlin.plugin.spring'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.jetbrains.kotlin.plugin.jpa'
    apply plugin: 'io.gitlab.arturbosch.detekt'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
        implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
        implementation 'org.jetbrains.kotlin:kotlin-reflect'
        implementation 'org.springframework.boot:spring-boot-starter-websocket'
        runtimeOnly 'com.h2database:h2'
        runtimeOnly 'com.mysql:mysql-connector-j'

        //test
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'io.kotest:kotest-runner-junit5-jvm:5.9.1'
        testImplementation 'io.kotest:kotest-assertions-core-jvm:5.9.1'
        testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring30x:4.6.2'
        testImplementation 'com.github.codemonstur:embedded-redis:1.4.3'
        testImplementation 'io.mockk:mockk:1.13.13'

        //그라파나, 프로메테우스, 액츄에이터
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus:1.14.2'

        //kotlin jdsl
        implementation 'com.linecorp.kotlin-jdsl:jpql-dsl:3.5.3'
        implementation 'com.linecorp.kotlin-jdsl:jpql-render:3.5.3'
        implementation 'com.linecorp.kotlin-jdsl:spring-data-jpa-support:3.5.3'

        // jasypt
        implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

        //aws s3
        implementation 'software.amazon.awssdk:s3:2.29.43'
    }

    kotlin {
        compilerOptions {
            freeCompilerArgs.addAll '-Xjsr305=strict'
        }
    }

    allOpen {
        annotation 'jakarta.persistence.Entity'
        annotation 'jakarta.persistence.MappedSuperclass'
        annotation 'jakarta.persistence.Embeddable'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    configurations.matching { it.name == "detekt" }.configureEach {
        resolutionStrategy.eachDependency {
            if (requested.group == "org.jetbrains.kotlin") {
                useVersion("2.0.10")
            }
        }
    }

    detekt {
        config.setFrom("$rootDir/detekt.yml")
        reports {
            xml.required.set(true)
        }
    }

    tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
        finalizedBy(reportMerge)
    }

    reportMerge.configure {
        input.from(tasks.withType(io.gitlab.arturbosch.detekt.Detekt).collect { it.xmlReportFile })
    }
}

bootJar {
    enabled = false
}
