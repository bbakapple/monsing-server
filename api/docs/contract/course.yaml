openapi: 3.0.0
info:
  title: 수업 API
  version: 1.0.0
  description: 수업 관련 API

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /courses:
    post:
      summary: 강의 등록
      security:
        - BearerAuth: [ ]
      operationId: createCourse
      tags:
        - Course
      requestBody:
        description: 강의 등록 요청
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '200':
          description: 성공
        '400':
          description: 잘못된 요청

    get:
      summary: 강의 목록 조회
      operationId: getCourses
      tags:
        - Course
      parameters:
        - name: teacherId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: 조회할 강사 iD
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseResponse'
        '400':
          description: 잘못된 요청입니다.
  
  /courses/{id}:
    patch:
      summary: 수업 수정
      security:
        - BearerAuth: [ ]
      operationId: updateCourse
      tags:
        - Course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 수정할 강의 ID
      requestBody:
        description: 수정할 정보
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          description: 성공
        '400':
          description: 잘못된 요청입니다.

  /courses/{id}/lessons:
    get:
      summary: 강의 수업 목록 조회
      operationId: getLessons
      tags:
        - Course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 조회할 강의 ID
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonResponse'
        '400':
          description: 잘못된 요청입니다.

  /courses/{courseId}/lessons/{lessonId}:
    post:
      summary: 수업 신청
      security:
        - BearerAuth: [ ]
      operationId: registerLesson
      tags:
        - Course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 신청할 강의 ID
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 신청할 수업 ID
      requestBody:
        description: 수업 신청
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRegisterRequest'
      responses:
        '200':
          description: 성공
        '400':
          description: 잘못된 요청입니다.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CourseCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: 수업 이름
        description:
          type: string
          description: 수업 설명
        curriculum:
          type: string
          description: 수업 커리큘럼
        duration:
          type: integer
          description: 수업 소요 시간
        price:
          type: integer
          description: 수업 1회 가격
        minimumLessonCount:
          type: integer
          description: 최소 수업 횟수
        lessonSchedule:
          type: array
          items:
            $ref: '#/components/schemas/LessonScheduleRequest'

      required:
        - name
        - description
        - curriculum
        - duration
        - price
        - minimumLessonCount
        - lessonSchedule

    LessonScheduleRequest:
      type: object
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDto'
        startTime:
          type: string
          example: "18:00"
          description: 수업 시작 시간
      required:
        - dayOfWeek
        - startTime

    DayOfWeekDto:
      type: string
      enum:
        - MON
        - TUE
        - WED
        - THU
        - FRI
        - SAT
        - SUN
      description: 수업 요일

    CourseUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: 수업 이름
        description:
          type: string
          description: 수업 설명
        curriculum:
          type: string
          description: 수업 커리큘럼
        duration:
          type: integer
          description: 수업 소요 시간
        price:
          type: integer
          description: 수업 1회 가격
        minimumLessonCount:
          type: integer
          description: 최소 수업 횟수

    LessonRegisterRequest:
      type: object
      properties:
        lessonCount:
          type: integer
          description: 수업 횟수
      required:
        - lessonCount

    CourseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 수업 ID
        teacherId:
          type: integer
          format: int64
          description: 선생님 ID
        name:
          type: string
          description: 수업 이름
        description:
          type: string
          description: 수업 설명
        curriculum:
          type: string
          description: 수업 커리큘럼
        duration:
          type: integer
          description: 수업 소요 시간
        price:
          type: integer
          description: 수업 1회당 가격
        minimumLessonCount:
          type: integer
          description: 최소 수업 횟수
      
      required:
        - id
        - teacherId
        - name
        - description
        - curriculum
        - duration
        - price
        - minimumLessonCount

    LessonResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 수업 ID
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeekDto'
        startTime:
          type: string
          description: 수업 시작 시간
        isAvailable:
          type: boolean
          description: 수업 신청 가능 여부

      required:
        - id
        - dayOfWeek
        - startTime
        - isAvailable

